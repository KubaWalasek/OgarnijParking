<!-- HTML -->
<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Zaproszenie</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        /* Podstawowe style przyjazne klientom pocztowym */
        body { margin:0; padding:0; background:#f5f7fb; }
        .wrapper { width:100%; background:#f5f7fb; padding:24px 0; }
        .container {
            width:100%; max-width:600px; margin:0 auto;
            background:#ffffff; border:1px solid #e6eef7; border-radius:12px;
            box-shadow:0 6px 22px rgba(25,118,210,.12); overflow:hidden;
            font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
            color:#1f2937;
        }
        .header {
            background:#e3f2fd; padding:18px 22px; border-bottom:1px solid #cfe8ff;
            text-align:center;
        }
        .title {
            margin:0; font-size:20px; font-weight:800; color:#1976d2; letter-spacing:.02em;
        }
        .content { padding:22px; font-size:15px; line-height:1.6; }
        .meta {
            background:#f8fafc; border:1px solid #e6eef7; border-radius:10px;
            padding:12px 14px; margin: 8px 0 16px 0; font-size:14px; color:#425874;
        }
        .meta b { color:#0f2942; }
        .map {
            margin: 8px 0 16px 0; text-align:center;
        }
        .map img {
            width:100%; max-width:560px; height:auto; border-radius:10px;
            border:1px solid #e6eef7; display:block; margin:0 auto;
        }
        .btn-wrap { text-align:center; margin:18px 0 6px 0; }
        .btn {
            display:inline-block; background:#1976d2; color:#fff !important; text-decoration:none;
            padding:12px 18px; border-radius:10px; font-weight:700; letter-spacing:.02em;
        }
        .footer {
            font-size:12px; color:#6b7280; text-align:center; padding:0 22px 18px 22px;
        }
        @media (max-width: 620px) {
            .content { padding:18px; }
            .map img { border-radius:8px; }
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="container">
        <div class="header">
            <h1 class="title">Zaproszenie do miejsca</h1>
        </div>
        <div class="content">
            <div class="meta">
                <div><b>Autor:</b> {{ author_email }}</div>

            </div>

            {% if description %}
                <p style="white-space: pre-line; margin-top:0;">{{ description }}</p>
            {% endif %}


            <div class="btn-wrap">
                <a class="btn" href="{{ map_url }}">Zobacz lokalizację</a>
            </div>
        </div>
        <div class="footer">
            Jeśli przycisk nie działa, skopiuj link do przeglądarki: {{ map_url }}
        </div>
    </div>
</div>
</body>
</html>
